<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KaNote</title>
    <base href="/KNote/" />
    <link rel="icon" href="favicon.ico" />
    <link href="css/app.css" rel="stylesheet" />
    <!-- The Radzen theme and css/knt-theme.css are added by App.razor (RadzenTheme), after these; knt-theme.js
         preloads the theme saved in the browser while the app starts. -->
    <script src="js/knt-theme.js"></script>
    <link href="KNote.Client.styles.css" rel="stylesheet" />
</head>

<body>

    <app>Loading...</app>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <!-- Draws the notes' Mermaid diagrams (Shared/ViewMarkdown); it loads lib/mermaid/mermaid.min.js when needed. -->
    <script src="lib/mermaid/kntMermaid.js"></script>

    <script>
        window.ScrollToBottom = (elementName) => {
            element = document.getElementById(elementName);
            element.scrollTop = element.scrollHeight - element.clientHeight;
        }
    </script>

</body>

</html>
